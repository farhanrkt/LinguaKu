# Japanese for Indonesian speakers — the contrastive taxonomy (SPEC §3.2).
#
# This file has a shape the English one does not, and the difference is the
# point of §3.2. English is a list of interference patterns: things Indonesian
# does that English punishes. Japanese is two lists.
#
#   * `positiveTransfer: true` categories are **advantages**. Indonesian
#     speakers start Japanese ahead of English speakers in several concrete,
#     nameable ways, and SPEC §3.2 says to surface them explicitly: "naming the
#     parallel is elaborative encoding, and it is a real morale advantage this
#     audience is never told about". They carry a note and no drills — there is
#     nothing to remediate.
#
#   * everything else is a genuine difficulty, drilled like the English ones.
#
# Authoring rules, as for en.yaml: the note explains what Indonesian does, then
# what Japanese does, then one minimal pair. Copy addresses the learner as
# "Anda", in a professional register (D110), and never frames a difficulty as a
# personal failing.
#
# Romaji (D111). The compiler writes it for every Japanese string: inline after
# Japanese inside Indonesian prose — は becomes "は (wa)" — as a line under a
# Japanese sentence prompt, and one per option. Where the tokenizer reads a
# string wrongly, write the reading yourself:
#
#   * in prose, either as `人{nin}` or as a parenthesis that opens with the
#     romaji — `おばさん (obasan, bibi)`. A parenthesis that opens with anything
#     else is a gloss, and the compiler adds the romaji in front of it;
#   * for a sentence prompt, an option or an answer, under `romaji:`.
#
# IPAdic is trained on text with kanji in it, so all-hiragana sentences and
# options that are ungrammatical on purpose are the usual suspects.

version: 1
lang: ja
l1: id

categories:
  # ------------------------------------------------- positive transfer (§3.2)

  - id: VOWELS_MATCH
    kind: phonology
    positiveTransfer: true
    label: "Vokal yang sama persis"
    summary: "a, i, u, e, o — lima vokal yang sudah Anda gunakan setiap hari."
    note:
      l1: >-
        Bahasa Indonesia memiliki lima vokal: a, i, u, e, o. Anda
        mengucapkannya setiap hari tanpa perlu memikirkannya.
      target: >-
        Bahasa Jepang memiliki lima vokal yang sama, dengan pengucapan yang
        hampir sama pula. Ini keuntungan besar yang jarang disebutkan: penutur
        bahasa Inggris harus mempelajari ulang setiap vokal Jepang karena
        bahasa mereka memiliki belasan bunyi vokal yang berbeda. Anda tidak
        perlu melakukannya. Kata seperti neko, sushi, atau tanoshii sudah dapat
        Anda ucapkan dengan hampir tepat sejak hari pertama.
      minimalPair:
        wrong: "Penutur bahasa Inggris sering mengucapkan “soo-SHEE” dengan bunyi yang kurang tepat."
        right: "su-shi — persis seperti membaca tulisan bahasa Indonesia."
        gloss: "Bacalah apa adanya. Untuk vokal, naluri Anda sudah tepat."
      tip: >-
        Jika ragu cara membaca kata Jepang dalam romaji, bacalah seperti
        tulisan bahasa Indonesia. Dalam sebagian besar kasus, cara itu sudah
        tepat.

  - id: OPEN_SYLLABLES
    kind: phonology
    positiveTransfer: true
    label: "Pola suku kata yang mirip"
    summary: "Konsonan-vokal, konsonan-vokal — sama seperti bahasa Indonesia."
    note:
      l1: >-
        Suku kata bahasa Indonesia umumnya berakhir dengan vokal: ma-kan, ki-ta,
        se-mu-a. Gugus konsonan seperti pada kata “strengths” tidak dikenal.
      target: >-
        Bahasa Jepang bekerja dengan cara yang sama: ka-ki-ku-ke-ko, semuanya
        suku kata terbuka. Tidak ada gugus konsonan yang perlu dilatih, dan
        tidak ada nada seperti dalam bahasa Mandarin atau Thai. Kebiasaan
        pengucapan bahasa Indonesia Anda dapat langsung digunakan.
      minimalPair:
        wrong: "Bahasa Inggris: “strengths” — sembilan huruf, satu suku kata."
        right: "Bahasa Jepang: すきです (su-ki-de-su) — empat suku kata, semuanya terbuka."
        gloss: "Ritmenya jauh lebih dekat dengan bahasa Indonesia daripada dengan bahasa Inggris."

  - id: NO_PLURAL_NO_ARTICLE
    kind: morphosyntax
    positiveTransfer: true
    label: "Tanpa bentuk jamak dan kata sandang"
    summary: "Tiga hal yang menyulitkan dalam bahasa Inggris tidak ada dalam bahasa Jepang."
    note:
      l1: >-
        Bahasa Indonesia tidak menandai bentuk jamak pada kata benda, tidak
        memiliki kata sandang seperti a/the, dan tidak membedakan jenis kelamin
        untuk “dia”.
      target: >-
        Bahasa Jepang juga tidak memiliki ketiganya. Hal-hal yang sering menjadi
        kendala dalam bahasa Inggris (book/books, a/the, he/she) tidak ada di
        sini. 本 dapat berarti satu buku atau banyak buku, persis seperti “buku”
        dalam bahasa Indonesia.
      minimalPair:
        wrong: "Bahasa Inggris mengharuskan: “I bought two books.”"
        right: "Bahasa Jepang: 本を二冊買いました (hon o nisatsu kaimashita) — kata bendanya tidak berubah."
        gloss: "Saya membeli dua buku. Sama seperti bahasa Indonesia."
      tip: >-
        Jika Anda pernah kesulitan dengan akhiran -s dan a/the dalam bahasa
        Inggris, anggaplah ini sebagai kemudahan. Waktu belajar Anda dapat
        digunakan untuk hal lain.

  - id: CLASSIFIERS_FAMILIAR
    kind: morphosyntax
    positiveTransfer: true
    label: "Kata penggolong yang sudah Anda kenal"
    summary: "ekor, buah, orang, batang → 匹{hiki}, 個{ko}, 人{nin}, 本{hon}."
    note:
      l1: >-
        Bahasa Indonesia sudah menggunakan kata penggolong: dua ekor kucing,
        tiga buah apel, lima orang teman, sebatang pensil. Anda menggunakannya
        tanpa pernah mempelajari aturannya secara khusus.
      target: >-
        Bahasa Jepang menggunakan konsep yang sama persis, hanya kata-katanya
        yang berbeda: 匹{hiki} untuk hewan kecil (ekor), 個{ko} untuk benda
        kecil (buah), 人{nin} untuk orang (orang), dan 本{hon} untuk benda
        panjang (batang). Penutur bahasa Inggris harus mempelajari konsep ini
        dari awal dan sering merasa asing dengannya; Anda cukup mengganti
        kosakatanya.
      minimalPair:
        wrong: "Bukan konsep baru yang harus dipahami dari awal."
        right: "dua ekor kucing → 猫が二匹 (neko ga nihiki)"
        gloss: "Polanya sama: bilangan ditambah kata penggolong, yang dipilih menurut jenis bendanya."
      tip: >-
        Cocokkan saja: ekor → 匹{hiki}, buah → 個{ko}, orang → 人{nin},
        batang → 本{hon}, lembar → 枚{mai}. Sisanya dapat dipelajari secara
        bertahap.

  - id: TOPIC_FRONTING
    kind: morphosyntax
    positiveTransfer: true
    label: "Topik di awal kalimat"
    summary: "“Buku itu, saya sudah membacanya” — itulah fungsi は."
    note:
      l1: >-
        Bahasa Indonesia sering menempatkan topik di awal kalimat: “Buku itu,
        saya sudah membacanya.” “Nasi goreng, saya suka.” Kalimat seperti ini
        terdengar wajar.
      target: >-
        Itulah fungsi partikel は. Bahasa Jepang menandai topik dengan cara yang
        sudah Anda kenal, sementara penutur bahasa Inggris harus membangun
        intuisi ini dari awal karena bahasa Inggris tidak memiliki cara alami
        untuk melakukannya.
      minimalPair:
        wrong: "Bahasa Inggris mengharuskan: “As for that book, I have already read it.” — terdengar kaku."
        right: "その本は、もう読みました (sono hon wa, mou yomimashita)"
        gloss: "Buku itu, saya sudah membacanya. Strukturnya sama."
      tip: >-
        Saat menemukan は, terjemahkan dalam hati menjadi “mengenai ___” atau
        “___ itu,”. Maknanya akan langsung terasa jelas.

  - id: POLITENESS_REGISTERS
    kind: pragmatics
    positiveTransfer: true
    label: "Tingkat kesopanan yang sudah Anda kuasai"
    summary: "kamu/Anda, ngoko/krama → bentuk biasa/丁寧/敬語."
    note:
      l1: >-
        Anda sudah terbiasa menyesuaikan cara berbicara dengan lawan bicara:
        kamu atau Anda, bahasa santai atau bahasa halus. Jika Anda menguasai
        bahasa Jawa atau Sunda, Anda bahkan sudah terbiasa dengan tingkatan
        ngoko dan krama yang lebih rumit.
      target: >-
        Bahasa Jepang memiliki tingkatan yang serupa: bentuk biasa, bentuk
        丁寧 (teinei, sopan, dengan です／ます), dan 敬語 (keigo, sangat hormat).
        Bagi penutur bahasa Inggris, konsep ini asing dan sering menimbulkan
        kekeliruan. Bagi Anda, ini hanyalah kosakata baru untuk kebiasaan yang
        sudah Anda miliki.
      minimalPair:
        wrong: "Bukan aturan baru yang harus dihafalkan dari awal."
        right: "行く (iku, biasa) → 行きます (ikimasu, sopan) — seperti “pergi” dan “berangkat, Pak”."
        gloss: "Naluri kapan harus bersikap sopan sudah Anda miliki. Yang perlu dipelajari hanya bentuknya."
      tip: >-
        Jika ragu, gunakan bentuk ます. Bentuk ini setara dengan “Anda” — aman
        untuk hampir semua situasi dengan orang yang belum akrab.

  # ---------------------------------------------- genuine difficulties (§3.2)

  - id: PARTICLES_WA_GA
    kind: morphosyntax
    label: "は dan が"
    summary: "Topik dan subjek — perbedaan yang tidak ada dalam bahasa Indonesia."
    note:
      l1: >-
        Bahasa Indonesia tidak menandai topik maupun subjek dengan partikel.
        Dalam “Saya suka kopi”, tidak ada penanda apa pun pada kata “saya”.
      target: >-
        Bahasa Jepang membedakan は sebagai penanda topik (“mengenai hal ini”)
        dari が sebagai penanda subjek (“yang melakukan atau yang dimaksud,
        sebagai informasi baru”). Kabar
        baiknya, Anda sudah memiliki jembatan untuk は melalui kebiasaan
        menempatkan topik di awal kalimat. Yang perlu dilatih adalah kapan が
        digunakan untuk menunjuk sesuatu yang baru atau yang membedakan.
      minimalPair:
        wrong: "私はコーヒーがすきです — “mengenai saya, kopilah yang disukai”"
        right: "誰がしましたか → 私がしました, bukan 私はしました"
        gloss: "Pertanyaan “siapa” memerlukan が, karena jawabannya merupakan informasi baru."
      tip: >-
        Pola praktis: jawaban atas pertanyaan “siapa/apa yang…” hampir selalu
        menggunakan が. Kalimat yang memperkenalkan topik lalu membahasnya
        menggunakan は.
    drills:
      - id: PARTICLES_WA_GA-1
        type: mcq
        prompt: "誰___ 来ましたか。(Siapa yang datang?)"
        options: ["が", "は", "を", "に"]
        answer: "が"
        explain: "Pertanyaan “siapa” menanyakan informasi baru, sehingga digunakan が, bukan は."
        difficulty: 1220
      - id: PARTICLES_WA_GA-2
        type: mcq
        prompt: "私___ 学生です。(Saya seorang pelajar.)"
        options: ["は", "が", "を", "で"]
        answer: "は"
        explain: "Memperkenalkan diri sebagai topik: “mengenai saya…”. Ini pola topik di awal kalimat yang sudah Anda kenal."
        difficulty: 1080
      - id: PARTICLES_WA_GA-3
        type: mcq
        prompt: "Mana yang benar untuk menjawab 「誰がしましたか」?"
        options: ["私がしました。", "私はしました。", "私をしました。", "私でしました。"]
        answer: "私がしました。"
        romaji:
          options: { "私でしました。": "watashi de shimashita." }
        explain: "Jawaban atas pertanyaan “siapa” menggunakan が, karena yang ditanyakan justru pelakunya."
        difficulty: 1280
      - id: PARTICLES_WA_GA-4
        type: cloze
        prompt: "象___ 鼻が長い。(Gajah itu, belalainya panjang.) — isi bagian pertama"
        answer: "は"
        explain: "Topik lebih dahulu (gajah), lalu subjek di dalamnya (belalai). Persis seperti “gajah itu, belalainya panjang”."
        difficulty: 1340
      - id: PARTICLES_WA_GA-5
        type: mcq
        prompt: "空___ 青いです。(Langitnya biru — sekadar pernyataan.)"
        options: ["は", "が", "も", "を"]
        answer: "は"
        explain: "Pernyataan umum tentang suatu topik menggunakan は."
        difficulty: 1180

      - id: PARTICLES_WA_GA-6
        type: correction
        prompt: 'わたしがたなかです。はじめまして。'
        answer: 'わたしはたなかです。はじめまして。'
        romaji:
          prompt: "watashi ga Tanaka desu. hajimemashite."
          answer: "watashi wa Tanaka desu. hajimemashite."
        explain: 'Memperkenalkan diri berarti menyebut topik, bukan menjawab pertanyaan “siapa”. Topik ditandai dengan は; が digunakan ketika Anda menegaskan orangnya.'
        difficulty: 1200

  - id: PARTICLES_NI_DE
    kind: morphosyntax
    label: "に dan で"
    summary: "Dua “di” dengan fungsi yang berbeda."
    note:
      l1: >-
        Satu kata “di” dalam bahasa Indonesia mencakup tempat keberadaan, tempat
        kegiatan, dan waktu sekaligus. “Di rumah” dapat berarti semuanya.
      target: >-
        Bahasa Jepang memisahkannya. に menandai tempat keberadaan, tujuan, dan
        titik waktu. で menandai tempat suatu kegiatan *dilakukan*, serta alat
        atau cara. Kalimat “saya belajar di rumah” dan “saya ada di rumah”
        menggunakan partikel yang berbeda.
      minimalPair:
        wrong: "家に勉強します"
        right: "家で勉強します"
        gloss: "Belajar adalah kegiatan, sehingga tempatnya ditandai dengan で. Namun 家にいます (ie ni imasu, ada di rumah) menggunakan に."
      tip: >-
        Tanyakan pada diri Anda: apakah ini tempat *berada* atau tempat
        *melakukan sesuatu*? Berada → に. Melakukan → で.
    drills:
      - id: PARTICLES_NI_DE-1
        type: mcq
        prompt: "図書館___ 本を読みます。(Membaca buku di perpustakaan.)"
        options: ["で", "に", "を", "へ"]
        answer: "で"
        explain: "Membaca adalah kegiatan, sehingga tempat kegiatannya ditandai dengan で."
        difficulty: 1200
      - id: PARTICLES_NI_DE-2
        type: mcq
        prompt: "教室___ 学生がいます。(Ada murid di kelas.)"
        options: ["に", "で", "を", "と"]
        answer: "に"
        explain: "います menyatakan keberadaan, sehingga tempatnya ditandai dengan に."
        difficulty: 1210
      - id: PARTICLES_NI_DE-3
        type: cloze
        prompt: "七時___ 起きます。(Bangun pukul tujuh.)"
        answer: "に"
        romaji:
          prompt: "shichiji___ okimasu."
        explain: "Titik waktu yang spesifik menggunakan に — mirip aturan “at” dalam bahasa Inggris."
        difficulty: 1250
      - id: PARTICLES_NI_DE-4
        type: mcq
        prompt: "バス___ 行きます。(Pergi dengan bus.)"
        options: ["で", "に", "を", "が"]
        answer: "で"
        explain: "で juga menandai alat atau cara: naik bus, menggunakan pulpen, dengan tangan."
        difficulty: 1290
      - id: PARTICLES_NI_DE-5
        type: mcq
        prompt: "Mana yang benar untuk “Saya ada di rumah”?"
        options: ["家にいます。", "家でいます。", "家をいます。", "家へいます。"]
        answer: "家にいます。"
        explain: "Keberadaan → に. Bandingkan dengan 家で勉強します (ie de benkyou shimasu, belajar di rumah), yang menggunakan で."
        difficulty: 1230

      - id: PARTICLES_NI_DE-6
        type: correction
        prompt: 'としょかんにほんをよみます。'
        answer: 'としょかんでほんをよみます。'
        romaji:
          prompt: "toshokan ni hon o yomimasu."
          answer: "toshokan de hon o yomimasu."
        explain: 'Tempat berlangsungnya kegiatan ditandai dengan で. に digunakan untuk tujuan atau keberadaan, bukan untuk tempat melakukan sesuatu.'
        difficulty: 1200

  - id: WORD_ORDER_SOV
    kind: morphosyntax
    label: "Kata kerja di akhir kalimat"
    summary: "Bahasa Jepang menempatkan kata kerja di bagian paling akhir."
    note:
      l1: >-
        Bahasa Indonesia menyusun kalimat dengan urutan subjek–predikat–objek:
        “Saya makan nasi.” Kata kerjanya berada di tengah, dan kata yang
        menerangkan datang setelah kata yang diterangkan (nasi goreng, mobil
        merah).
      target: >-
        Bahasa Jepang berkebalikan dalam dua hal sekaligus. Kata kerja selalu
        berada di akhir — 私はご飯を食べます, secara harfiah “saya nasi makan” —
        dan kata yang menerangkan selalu datang **sebelum** kata yang
        diterangkan. Dalam
        kalimat panjang, Anda perlu menyimak hingga akhir kalimat sebelum
        mengetahui apa yang terjadi.
      minimalPair:
        wrong: "私は食べますご飯を"
        right: "私はご飯を食べます"
        gloss: "Saya makan nasi. Kata kerjanya menutup kalimat, bukan berada di tengah."
      tip: >-
        Saat menyusun kalimat bahasa Jepang, tuliskan terlebih dahulu maksud
        Anda dalam bahasa Indonesia, lalu pindahkan kata kerjanya ke bagian
        paling akhir.
    drills:
      - id: WORD_ORDER_SOV-1
        type: mcq
        prompt: "Mana urutan yang benar untuk “Saya minum air”?"
        options: ["私は水を飲みます。", "私は飲みます水を。", "飲みます私は水を。", "水を私は飲みます飲みます。"]
        answer: "私は水を飲みます。"
        explain: "Subjek, objek, lalu kata kerja di akhir."
        difficulty: 1120
      - id: WORD_ORDER_SOV-2
        type: mcq
        prompt: "Mana yang benar untuk “buku merah”?"
        options: ["赤い本", "本赤い", "本が赤い本", "赤い が本"]
        answer: "赤い本"
        explain: "Kata yang menerangkan berada di depan — kebalikan dari “buku merah” dalam bahasa Indonesia."
        difficulty: 1150
      - id: WORD_ORDER_SOV-3
        type: mcq
        prompt: "Bagaimana menyusun “orang yang saya temui kemarin”?"
        options: ["昨日会った人", "人昨日会った", "会った昨日人", "人が昨日会った"]
        answer: "昨日会った人"
        romaji:
          options: { "会った昨日人": "atta kinou hito" }
        explain: "Seluruh anak kalimat pun ditempatkan di depan kata bendanya. Bagian inilah yang paling perlu dibiasakan."
        difficulty: 1380
      - id: WORD_ORDER_SOV-4
        type: mcq
        prompt: "Mana yang benar untuk “Saya tidak makan nasi”?"
        options: ["私はご飯を食べません。", "私は食べませんご飯を。", "私はご飯を食べますません。", "食べません私はご飯を。"]
        answer: "私はご飯を食べません。"
        romaji:
          options: { "私はご飯を食べますません。": "watashi wa gohan o tabemasu masen." }
        explain: "Bentuk negatif tetap melekat pada kata kerja, dan kata kerjanya tetap berada di akhir."
        difficulty: 1240

      - id: WORD_ORDER_SOV-5
        type: correction
        prompt: 'わたしはたべますごはんを。'
        answer: 'わたしはごはんをたべます。'
        explain: 'Kata kerja bahasa Jepang selalu berada di akhir kalimat. Urutan bahasa Indonesia (subjek–predikat–objek) perlu diubah menjadi subjek–objek–predikat.'
        difficulty: 1200

  - id: MORA_TIMING
    kind: phonology
    label: "Panjang pendek bunyi"
    summary: "おばさん (obasan) dan おばあさん (obaasan) adalah dua kata yang berbeda."
    note:
      l1: >-
        Bahasa Indonesia tidak membedakan makna melalui panjang pendek bunyi.
        “Sapi” yang diucapkan agak panjang atau agak pendek tetap berarti sapi.
      target: >-
        Dalam bahasa Jepang, panjang bunyi **mengubah makna**. Setiap mora
        memiliki panjang yang sama, dan vokal panjang, konsonan rangkap (っ),
        serta ん masing-masing menempati satu ketukan penuh. Ini satu-satunya
        bagian fonologi Jepang yang benar-benar baru bagi Anda — sisanya justru
        lebih mudah daripada bagi penutur bahasa Inggris.
      minimalPair:
        wrong: "おばさん (obasan, bibi)"
        right: "おばあさん (obaasan, nenek)"
        gloss: "Satu ketukan lebih panjang, dan orangnya berbeda satu generasi."
      tip: >-
        Hitunglah ketukannya seperti ketukan lagu: o-ba-a-sa-n terdiri atas lima
        ketukan, o-ba-sa-n empat. Ucapkan sambil mengetuk meja.
    drills:
      - id: MORA_TIMING-1
        type: minimal-pair
        audio: true
        prompt: "Kata mana yang Anda dengar?"
        say: "おばあさん"
        options: ["おばあさん", "おばさん"]
        answer: "おばあさん"
        explain: "Vokal a ditahan satu ketukan lebih lama: nenek, bukan bibi."
      - id: MORA_TIMING-2
        type: minimal-pair
        audio: true
        prompt: "Kata mana yang Anda dengar?"
        say: "きって"
        options: ["きって", "きて"]
        answer: "きって"
        explain: "っ menahan konsonan selama satu ketukan: きって (kitte, perangko), きて (kite, datanglah)."
      - id: MORA_TIMING-3
        type: minimal-pair
        audio: true
        prompt: "Kata mana yang Anda dengar?"
        say: "ビル"
        options: ["ビル", "ビール"]
        answer: "ビル"
        explain: "ビル (biru) berarti gedung, ビール (biiru) berarti bir. Perbedaannya satu ketukan."
      - id: MORA_TIMING-4
        type: mcq
        prompt: "Ada berapa ketukan (mora) dalam 「がっこう」?"
        options: ["empat", "tiga", "dua", "lima"]
        answer: "empat"
        explain: "Empat: が (ga), っ, こ (ko), う (u). っ dan う masing-masing satu ketukan penuh, meskipun tidak terdengar sebagai bunyi tersendiri."
        difficulty: 1310
      - id: MORA_TIMING-5
        type: mcq
        prompt: "「ん」 dalam 「にほん」 (nihon) dihitung berapa ketukan?"
        options: ["satu", "nol — hanya penutup", "setengah", "dua"]
        answer: "satu"
        explain: "ん adalah mora penuh. Inilah yang membuat ritme bahasa Jepang terdengar rata."
        difficulty: 1280

  - id: SCRIPT_KANA
    kind: script
    label: "Hiragana dan katakana"
    summary: "Dua set huruf untuk bunyi yang sama."
    note:
      l1: >-
        Bahasa Indonesia menggunakan satu set huruf Latin, dan hubungannya dengan
        bunyi hampir selalu satu banding satu — itulah sebabnya bahasa Indonesia
        mudah dibaca.
      target: >-
        Bahasa Jepang memiliki dua set huruf untuk bunyi yang sama: hiragana
        untuk kata asli Jepang dan unsur tata bahasa, katakana untuk kata
        serapan dan penekanan. Kabar baiknya, keduanya sama teraturnya dengan
        huruf Latin dalam bahasa Indonesia — satu huruf, satu bunyi, tanpa
        kejutan seperti dalam bahasa Inggris. Yang memerlukan waktu hanyalah
        menghafalkannya.
      minimalPair:
        wrong: "すし ditulis demikian; コーヒー tidak ditulis dengan hiragana dalam penggunaan sehari-hari."
        right: "すし (sushi, kata Jepang) · コーヒー (koohii, kata serapan)"
        gloss: "Bentuknya berbeda, bunyinya sama. Yang membedakan adalah asal katanya."
      tip: >-
        Jika sebuah kata terasa sebagai serapan dari bahasa asing (kopi, roti,
        komputer), kemungkinan besar kata itu ditulis dengan katakana.
    drills:
      - id: SCRIPT_KANA-1
        type: mcq
        prompt: "Kata serapan seperti “kopi” biasanya ditulis dengan huruf apa?"
        options: ["katakana", "hiragana", "kanji", "romaji"]
        answer: "katakana"
        explain: "Katakana menandai kata dari bahasa asing — コーヒー."
        difficulty: 1090
      - id: SCRIPT_KANA-2
        type: mcq
        prompt: "「ねこ」 ditulis dengan huruf apa?"
        options: ["hiragana", "katakana", "romaji", "kanji"]
        answer: "hiragana"
        explain: "Kata asli Jepang ditulis dengan hiragana (atau dengan kanji: 猫)."
        difficulty: 1060
      - id: SCRIPT_KANA-3
        type: mcq
        prompt: "Mana pasangan hiragana–katakana untuk bunyi yang sama?"
        options: ["か – カ", "か – コ", "き – カ", "く – ケ"]
        answer: "か – カ"
        # The question is the script itself: romaji beside the options would
        # answer it. The reading arrives with the verdict.
        testsScript: true
        explain: "Setiap bunyi memiliki bentuk hiragana dan katakana tersendiri."
        difficulty: 1140

  - id: VERB_CONJUGATION
    kind: morphosyntax
    label: "Kata kerja berubah bentuk"
    summary: "Kata kerja bahasa Indonesia tidak berubah; kata kerja bahasa Jepang memiliki banyak bentuk."
    note:
      l1: >-
        Kata kerja bahasa Indonesia tidak berubah menurut waktu. “Saya pergi”
        dapat berarti kemarin, sekarang, atau besok — yang berubah hanya
        keterangan waktunya.
      target: >-
        Kata kerja bahasa Jepang berubah bentuk untuk menyatakan waktu,
        negasi, dan kesopanan, serta untuk menyambung kalimat. 行く menjadi
        行きます, 行きません, 行った, 行って. Untungnya, perubahannya jauh lebih
        teratur daripada dalam bahasa Inggris — hampir tidak ada bentuk tidak
        beraturan, sehingga setelah Anda menguasai polanya, semua kata kerja
        mengikutinya.
      minimalPair:
        wrong: "昨日行きます"
        right: "昨日行きました"
        gloss: "Kemarin saya pergi. Kata kerjanya sendiri yang menandai waktu lampau."
      tip: >-
        Mulailah dari dua bentuk saja: ます (masu, bentuk sopan sekarang) dan
        ました (mashita, bentuk sopan lampau). Keduanya sudah cukup untuk
        percakapan sehari-hari.
    drills:
      - id: VERB_CONJUGATION-1
        type: mcq
        prompt: "昨日、映画を___。(Kemarin menonton film.)"
        options: ["見ました", "見ます", "見ません", "見て"]
        answer: "見ました"
        explain: "Bentuk sopan lampau: ます → ました."
        difficulty: 1130
      - id: VERB_CONJUGATION-2
        type: mcq
        prompt: "Apa bentuk negatif sopan dari 食べます?"
        options: ["食べません", "食べました", "食べない です", "食べません でした"]
        answer: "食べません"
        explain: "ます → ません untuk bentuk negatif sekarang."
        difficulty: 1170
      - id: VERB_CONJUGATION-3
        type: cloze
        prompt: "毎日日本語を勉強___。(Belajar bahasa Jepang setiap hari — bentuk sopan.)"
        answer: "します"
        explain: "勉強 + します. Banyak kata benda menjadi kata kerja dengan menambahkan します."
        difficulty: 1210
      - id: VERB_CONJUGATION-4
        type: mcq
        prompt: "Mana bentuk lampau negatif sopan dari 行きます?"
        options: ["行きませんでした", "行きました", "行きません", "行かない"]
        answer: "行きませんでした"
        explain: "Bentuk lampau dan negatif digabungkan: ませんでした. Polanya tetap, sehingga tidak perlu dihafalkan per kata."
        difficulty: 1330

      - id: VERB_CONJUGATION-5
        type: correction
        prompt: 'きのう ともだちに あいます。'
        answer: 'きのう ともだちに あいました。'
        explain: 'きのう (kinou, kemarin) sudah menunjukkan waktu lampau, sehingga kata kerjanya ikut berubah: あいます menjadi あいました. Kata kerja bahasa Jepang berubah bentuk, tidak seperti kata kerja bahasa Indonesia.'
        difficulty: 1200

  - id: ADJ_CONJUGATION
    kind: morphosyntax
    label: "Kata sifat juga berubah bentuk"
    summary: "Kata sifat berakhiran い berubah bentuk seperti kata kerja."
    note:
      l1: >-
        Kata sifat bahasa Indonesia tidak berubah. “Mahal” tetap “mahal”, baik
        kemarin maupun sekarang, baik dalam kalimat positif maupun negatif.
      target: >-
        Dalam bahasa Jepang, kata sifat berakhiran い berubah seperti kata
        kerja: 高い → 高くない → 高かった. Hal ini tidak memiliki padanan dalam
        bahasa Indonesia, sehingga wajar jika pada awalnya terasa asing.
      minimalPair:
        wrong: "高いでした"
        right: "高かったです"
        gloss: "Dulu mahal. Yang berubah adalah kata sifatnya, bukan です."
      tip: >-
        Untuk kata sifat berakhiran い, hilangkan い lalu tambahkan くない untuk
        bentuk negatif atau かった untuk bentuk lampau. です ditambahkan di
        belakang sebagai bentuk sopan, tetapi tidak ikut berubah.
    drills:
      - id: ADJ_CONJUGATION-1
        type: mcq
        prompt: "Apa bentuk lampau sopan dari 高いです?"
        options: ["高かったです", "高いでした", "高くでした", "高いました"]
        answer: "高かったです"
        explain: "Kata sifatnya yang berubah: 高い → 高かった. です tetap."
        difficulty: 1290
      - id: ADJ_CONJUGATION-2
        type: mcq
        prompt: "Apa bentuk negatif dari 面白い?"
        options: ["面白くない", "面白いない", "面白ではない", "面白まない"]
        answer: "面白くない"
        explain: "Hilangkan い, lalu tambahkan くない."
        difficulty: 1250
      - id: ADJ_CONJUGATION-3
        type: cloze
        prompt: "この本は面白___ ないです。(Buku ini tidak menarik.)"
        answer: "く"
        explain: "面白い → 面白くない. Perhatikan bahwa い berubah menjadi く."
        difficulty: 1270

      - id: ADJ_CONJUGATION-4
        type: correction
        prompt: 'きのうのえいがは おもしろいでした。'
        answer: 'きのうのえいがは おもしろかったです。'
        romaji:
          prompt: "kinou no eiga wa omoshiroi deshita."
          answer: "kinou no eiga wa omoshirokatta desu."
        explain: 'Kata sifat berakhiran い berubah sendiri menjadi かった, bukan ditambah でした. Inilah perbedaannya dengan kata sifat berakhiran な.'
        difficulty: 1200

  - id: GIVING_RECEIVING
    kind: pragmatics
    label: "あげる, くれる, もらう"
    summary: "Arah pemberian ikut menentukan kata kerjanya."
    note:
      l1: >-
        Bahasa Indonesia memiliki satu kata “memberi” dan satu kata “menerima”.
        Siapa memberi kepada siapa tidak mengubah kata kerjanya.
      target: >-
        Bahasa Jepang memilih kata kerja menurut arah pemberian, dilihat dari
        posisi pembicara: あげる jika Anda memberi kepada orang lain, くれる jika
        orang lain memberi kepada Anda, dan もらう jika Anda menerima. Konsep ini
        memang asing — tidak ada dalam bahasa Indonesia maupun bahasa Inggris.
      minimalPair:
        wrong: "友達が私に本をあげました"
        right: "友達が私に本をくれました"
        gloss: "Teman memberi saya buku. Karena arahnya menuju saya, digunakan くれる."
      tip: >-
        Tanyakan: apakah arahnya menuju saya atau menjauh dari saya? Menuju
        saya → くれる／もらう. Menjauh → あげる.
    drills:
      - id: GIVING_RECEIVING-1
        type: mcq
        prompt: "友達が私にプレゼントを___。(Teman memberi saya hadiah.)"
        options: ["くれました", "あげました", "もらいました", "しました"]
        answer: "くれました"
        explain: "Arahnya menuju pembicara, sehingga digunakan くれる."
        difficulty: 1320
      - id: GIVING_RECEIVING-2
        type: mcq
        prompt: "私は友達にプレゼントを___。(Saya memberi hadiah kepada teman.)"
        options: ["あげました", "くれました", "もらいました", "いました"]
        answer: "あげました"
        explain: "Arahnya menjauh dari pembicara, sehingga digunakan あげる."
        difficulty: 1300
      - id: GIVING_RECEIVING-3
        type: mcq
        prompt: "私は友達にプレゼントを___。(Saya menerima hadiah dari teman.)"
        options: ["もらいました", "あげました", "くれました", "やりました"]
        answer: "もらいました"
        explain: "Dilihat dari sisi penerima: もらう."
        difficulty: 1340
