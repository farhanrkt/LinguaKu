# The parts a kanji is built from, named (SPEC §2.11, D121).
#
# A kanji card shows what the character is made of, so the learner can build a
# mnemonic from it. The parts come from KRADFILE (the `components` of each
# kanji in kanji.b1.json), which lists the radicals a kanji contains — and
# nothing more: not how they combine, and, for 98 of the 234 parts the shipped
# kanji use, no reading or meaning at all, because they are radicals rather than
# kanji in their own right. Before this table the card showed 厶, 冂 or 亠 with
# nothing beside them.
#
# KRADFILE also writes some radicals as a whole kanji that contains them,
# because JIS X 0208 has no code for the radical itself: 汁 stands for 氵, 扎
# for 扌, 化 for 亻. Shown raw, the card told a learner that 海 contains "soup".
# `glyph` is the form actually written in the character.
#
# Each entry: what to draw (`glyph`, where it differs), the part's romaji — its
# traditional radical name where it has one, otherwise its reading — and its
# meaning in Indonesian. Compiled by scripts/ingest/build-radicals.ts into
# assets/content/ja/radicals.json (dataset `linguaku-authored`, MIT), which fails
# on any part of a shipped kanji this table does not name, and on any entry no
# shipped kanji uses (invariant 32). Wants a native speaker's review.

