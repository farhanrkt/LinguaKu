# Topic clusters for Japanese (SPEC §2.10, §2.14, §2.8).
#
# Same purpose as `en.yaml` and one structural difference: Japanese headwords
# are dictionary forms from JMdict, so the words listed here are surface forms
# in kanji or kana exactly as the inventory holds them. The compiler checks
# every one against the shipped lexemes and fails on a miss, which is what keeps
# a hand-written list honest against a corpus it did not produce.
#
# Smaller than the English map on purpose. Coverage is published rather than
# claimed, and a word in no topic loses nothing — it simply is not boosted.
#
# Wants a native reviewer, like every other authored Japanese file here.

version: 1
lang: ja

topics:
