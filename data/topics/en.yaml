# Topic clusters for English (SPEC §2.10, §2.14, §2.8).
#
# Three separate requirements land on this one file, which is why it is worth
# authoring rather than inferring:
#
#  - **§2.10** orders new items by frequency, *"modulated by learner-selected
#    topic goals"*. Without topics there is nothing to modulate by.
#  - **§2.14 (autonomy)** says the learner *"picks topic clusters"*. Until now
#    the app offered them nothing to pick.
#  - **§2.8** forbids more than three items from one topic cluster in a row.
#    That rule has been running against `clusterId = "b3"` — the frequency band —
#    since M2, which made it a near-duplicate of the band gate rather than the
#    interleaving constraint it was written to be. This is the first content
#    that makes it real.
#
# ## Why authored, and what that costs
#
# Clustering the inventory automatically needs either embeddings (a model in the
# build) or a lexical database (a licence, and WordNet's domains are not this).
# A wrong topic is worse than no topic here, because topics *gate what a learner
# is taught next* — so this is a hand-written map, deliberately partial.
#
# **Partial is the design.** A word in no topic is not excluded from anything;
# it simply is not boosted when a topic is chosen, and it keeps its own band as
# its cluster for §2.8. Coverage is checked by the compiler and published, so
# "how much of the inventory is tagged" is a number rather than an impression.
#
# Every word here must exist in the shipped lexeme inventory — the compiler
# fails on one that does not, which is what stops this file from drifting as the
# corpus changes.

