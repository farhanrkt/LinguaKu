# Indonesian meanings for Japanese band-1 words (SPEC §2.3, §2.5).
#
# The only Indonesian source for Japanese meanings is id.wiktionary, which
# covers 79 of the 500 band-1 words — so a beginner met ある, 行く, 猫 and 本
# with no meaning shown at all. These are the other 421, written for the
# project (dataset `linguaku-authored`, MIT) and compiled by
# scripts/ingest/build-meanings.ts, which fails on any word the shipped
# inventory does not contain (invariant 32). A Wiktionary gloss, where one
# exists, still comes first.
#
# Style: the plainest everyday Indonesian equivalent, senses separated by ";",
# and a short description in parentheses for grammatical words that have no
# one-word equivalent. Like the contrastive notes, this wants a native
# speaker's review.

