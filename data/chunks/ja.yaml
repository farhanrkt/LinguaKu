# Japanese formulaic chunks (SPEC §2.5).
#
# §2.5 names 「お世話になります」 specifically, and it is the right example: it is
# not built from its parts in any way a learner can reconstruct, it is said
# constantly, and no Indonesian sentence maps onto it. Japanese has more of
# these than English does — most of the language's politeness lives in fixed
# formulas — so they are taught whole, which is what a chunk is for.
#
# Validated against the shipped corpus exactly as the English list is: a chunk
# the pipeline cannot anchor to a real sentence fails the build.
#
# Romaji (D111) is worked out by the compiler with the pipeline's tokenizer.
# Where it divides a phrase into words differently from a textbook, `romaji:`
# overrides it.
#
# The Indonesian is written in a professional register (D110) by a non-native
# writer and wants a native pass, and the Japanese wants a native reviewer more
# than the English does — the same caveat M6 recorded for the Japanese
# contrastive drills.

version: 1
lang: ja
l1: id

chunks:
  # ------------------------------------------------------------- greetings
  - text: 'おはようございます'
    id: 'selamat pagi (sopan)'
  - text: 'こんにちは'
    id: 'selamat siang; halo'
  - text: 'こんばんは'
    id: 'selamat malam (saat bertemu)'
  - text: 'おやすみなさい'
    id: 'selamat tidur'
  - text: 'さようなら'
    id: 'selamat tinggal'
  - text: 'ありがとうございます'
    id: 'terima kasih (sopan)'
  - text: 'どういたしまして'
    romaji: 'dou itashimashite'
    id: 'sama-sama'
  - text: 'すみません'
    id: 'permisi; maaf'
    note: 'Satu ungkapan untuk tiga keperluan: memanggil seseorang, meminta maaf, dan berterima kasih secara halus. Konteks yang menentukan maknanya.'
  - text: 'ごめんなさい'
    id: 'maaf'
    note: 'Lebih personal daripada すみません, dan tidak digunakan untuk memanggil pelayan.'
  - text: 'いただきます'
    id: '(ucapan sebelum makan)'
    note: 'Tidak memiliki padanan langsung. Ungkapan ini bukan doa, melainkan ucapan terima kasih atas makanan, dan selalu diucapkan sebelum makan.'
  - text: 'ごちそうさまでした'
    also: ['ごちそうさま']
    id: '(ucapan setelah makan)'

  # -------------------------------------------------------- meeting people
  - text: 'はじめまして'
    id: 'salam kenal'
  - text: 'よろしくお願いします'
    id: 'mohon kerja samanya'
    note: 'Diucapkan saat berkenalan, saat memulai kerja sama, dan di akhir sebuah permintaan. Tidak ada terjemahan tunggalnya.'
  - text: 'お世話になります'
    also: ['お世話になっております', 'お世話になりました', 'お世話になって']
    id: 'terima kasih atas bantuannya'
    note: 'Maknanya kurang lebih “saya berutang budi kepada Anda”. Frasa ini lazim digunakan sebagai salam dalam lingkungan kerja.'
  - text: 'お元気ですか'
    id: 'apa kabar'
  - text: 'お名前は'
    id: 'siapa nama Anda'

  # ------------------------------------------------------------ everyday
  - text: 'ちょっと待ってください'
    id: 'mohon tunggu sebentar'
  - text: 'もう一度'
    romaji: 'mou ichido'
    id: 'sekali lagi'
  - text: '大丈夫です'
    id: 'tidak apa-apa; saya baik-baik saja'
  - text: 'わかりました'
    id: 'saya mengerti; baik'
  - text: 'わかりません'
    id: 'saya tidak mengerti'
  - text: 'しかたがない'
    id: 'apa boleh buat'
  - text: 'そうですね'
    romaji: 'sou desu ne'
    id: 'benar juga; begitu, ya'
    note: 'Sering hanya berfungsi sebagai pengisi jeda sambil berpikir, bukan persetujuan penuh.'
